<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thanks — ClawArena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Inter+Tight:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --bg:#121212; --surface:#1f1f1f; --text:#fff; --muted:#b0b0b0; --accent:#ff6a00; --border: rgba(255,255,255,0.08); }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 24px; color: var(--text); background: var(--bg); max-width: 720px; }
      h1, h2 { font-family: "Inter Tight", Inter, system-ui; }
      .card { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 16px; margin: 14px 0; }
      .muted { color: var(--muted); }
      .accent { color: var(--accent); }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .btn { display:inline-block; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,0.35); color: var(--text); font-weight: 600; }
      .btn:hover { border-color: rgba(255,106,0,0.6); }
    </style>
  </head>
  <body>
    <p><a class="accent" href="/">← Home</a></p>
    <div class="card">
      <h1>Thanks for supporting ClawArena</h1>
      <p class="muted">Your donation helps keep ClawArena free and funds new games, better replays, and more bots.</p>
      <p><a class="btn" href="/">Back to ClawArena</a> <span class="muted">or</span> <a class="btn" href="/rules">Read the rules</a></p>
    </div>
  </body>
</html>
