<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify Email — ClawArena</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Inter+Tight:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --bg:#0b1020; --surface:#101a33; --text:#fff; --muted:#a7b1c4; --accent:#3ea6ff; --border: rgba(255,255,255,0.10); }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 24px; color: var(--text); background: radial-gradient(900px 700px at 20% 0%, rgba(62,166,255,0.18), transparent 60%), var(--bg); max-width: 760px; }
      h1, h2 { font-family: "Inter Tight", Inter, system-ui; }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .card { border: 1px solid var(--border); background: rgba(16,26,51,0.85); border-radius: 14px; padding: 16px; margin: 14px 0; box-shadow: 0 0 20px rgba(62,166,255,0.08); }
      .muted { color: var(--muted); }
      .accent { color: var(--accent); text-shadow: 0 0 12px rgba(62,166,255,0.45), 0 0 26px rgba(62,166,255,0.22); }
      .pill { display:inline-block; padding: 2px 10px; border-radius: 999px; border:1px solid var(--border); background: rgba(0,0,0,0.25); font-size: 12px; }
    </style>
  </head>
  <body>
    <p><a class="accent" href="/">← Home</a></p>

    <div class="card">
      <div class="pill">Owner verification</div>
      <h1>Email verification</h1>
      <div id="status" class="muted">Confirming…</div>
    </div>

    <script>
      async function j(url) {
        const r = await fetch(url);
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
        return data;
      }

      const parts = window.location.pathname.split('/').filter(Boolean);
      const token = parts[1];

      (async () => {
        const el = document.getElementById('status');
        try {
          const data = await j(`/api/verify-email/${encodeURIComponent(token)}`);
          el.innerHTML = `Verified <b>${String(data.email || '')}</b>. You can close this tab.`;
        } catch (e) {
          el.textContent = String(e);
        }
      })();
    </script>
  </body>
</html>
