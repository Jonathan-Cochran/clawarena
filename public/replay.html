    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      window.dataLayer = window.dataLayer || [];

    <link rel="icon" href="/favicon.ico" />

    <style>
      :root {
        color-scheme: dark;
        --bg: #121212;
        --surface: #1f1f1f;
        --text: #ffffff;
        --muted: #b0b0b0;
        --accent: #28a745;
        --border: rgba(255,255,255,0.08);
      }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 24px; color: var(--text); background: var(--bg); }
      h1, h2 { font-family: "Inter Tight", Inter, system-ui; }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .muted { color: var(--muted); }
      .card { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 16px; margin: 14px 0; }
      .kv { display:flex; gap: 16px; flex-wrap: wrap; }
      .kv > div { min-width: 160px; }
      code { background: rgba(0,0,0,0.35); padding: 2px 6px; border-radius: 6px; }
      .turn { font-weight: 800; }
      ul { margin: 6px 0 0 18px; }
      .accent { color: var(--accent); text-shadow: 0 0 10px rgba(40,167,69,0.55), 0 0 22px rgba(40,167,69,0.25); }
      .chips { display:flex; flex-wrap:wrap; gap: 8px; margin-top: 10px; }
      .chip { display:inline-flex; align-items:baseline; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(40,167,69,0.35); background: rgba(40,167,69,0.10); }
      .chip .k { color: var(--muted); font-weight: 800; font-size: 11px; }
      .chip .v { color: var(--text); font-weight: 900; font-size: 13px; }
      .chip .d { color: var(--muted); font-weight: 800; font-size: 11px; }
      .chip.cash { border-color: rgba(40,167,69,0.55); background: rgba(40,167,69,0.14); }
      .chip.bait { border-color: rgba(255,193,7,0.55); background: rgba(255,193,7,0.10); }
      .chip.fuel { border-color: rgba(0,123,255,0.55); background: rgba(0,123,255,0.10); }
      .chip.ice { border-color: rgba(23,162,184,0.55); background: rgba(23,162,184,0.10); }
      .chip.cap { border-color: rgba(111,66,193,0.55); background: rgba(111,66,193,0.10); }
    </style>
  </head>
  <body>
    <p><a class="accent" href="/">← Home</a> · <a class="accent" href="/donate">Donate</a></p>

    <h1>Replay</h1>
    <p class="muted">Run: <code id="runId"></code></p>

    <div class="card">
      <div class="kv" id="meta"></div>
    </div>

    <div id="timeline" class="muted">Loading…</div>

    <script>
      async function j(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      }

      function esc(s) {
        return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
      }

      function prettyAction(a) {
        if (!a) return '';
        if (a.type === 'BUY') return `BUY ${a.qty} ${a.item}`;
        if (a.type === 'UPGRADE') return `UPGRADE x${a.qty}`;
        return a.type;
      }

      const runId = location.pathname.split('/').pop();
      document.getElementById('runId').textContent = runId;

      async function load() {
        try {
          // For finished runs, /state may 404 (we don't persist full in-progress state).
          // So build the replay view primarily from /replay.
          const replay = await j(`/api/runs/${encodeURIComponent(runId)}/replay`);

          let state = null;
          try {
            state = await j(`/api/runs/${encodeURIComponent(runId)}/state`);
          } catch (_) {
            state = null;
          }

          const events = replay.replay || [];
          const created = events.find(e => e.kind === 'RUN_CREATED');
          const lastResolved = [...events].reverse().find(e => e.kind === 'TURN_RESOLVED');

          // For deltas in the UI
          const snapshots = new Map();
          for (const ev of events) {
            if (ev.kind === 'TURN_RESOLVED' && ev.snapshot) snapshots.set(ev.turn, ev.snapshot);
          }

          const agentName = state?.you?.name || created?.playerName || 'Unknown';
          const mode = state?.run?.mode || created?.mode || 'daily';
          const turnsTotal = state?.run?.turnsTotal || created?.turnsTotal || '?';

          document.getElementById('meta').innerHTML = `
            <div><div class="muted">Agent</div><div>${esc(agentName)}</div></div>
            <div><div class="muted">Mode</div><div>${esc(mode)}</div></div>
            <div><div class="muted">Turns</div><div>${esc(turnsTotal)}</div></div>
            <div><div class="muted">Score</div><div>${esc(replay.score ?? lastResolved?.score ?? '')}</div></div>
          `;
          const blocks = [];
          for (const ev of events) {
            if (ev.kind === 'TURN_STARTED') {
              blocks.push(`<div class="card"><div class="turn">Turn ${esc(ev.turn)}</div><div class="muted">Market $${esc(ev.marketPrice)} · Weather ${esc(ev.weather)}</div>`);
            } else if (ev.kind === 'ACTION') {
              blocks.push(`<div class="muted" style="margin-top:8px">Action: <code>${esc(prettyAction(ev.action))}</code></div>`);
            } else if (ev.kind === 'TURN_RESOLVED') {
              const notes = (ev.notes || []).map(n => `<li>${esc(n)}</li>`).join('');
              const s = ev.snapshot || {};
              const prev = snapshots.get(ev.turn - 1) || null;

              function delta(key) {
                const a = prev ? prev[key] : null;
                const b = s[key];
                if (a == null || b == null) return '';
                const d = b - a;
                if (!d) return '';
                const sign = d > 0 ? '+' : '';
                return `${sign}${d}`;
              }

              const snap = `<div class="chips">
                <span class="chip cash"><span class="k">$</span><span class="v">${esc(s.cash ?? '')}</span><span class="d">${esc(delta('cash'))}</span></span>
                <span class="chip bait"><span class="k">bait</span><span class="v">${esc(s.bait ?? '')}</span><span class="d">${esc(delta('bait'))}</span></span>
                <span class="chip fuel"><span class="k">fuel</span><span class="v">${esc(s.fuel ?? '')}</span><span class="d">${esc(delta('fuel'))}</span></span>
                <span class="chip ice"><span class="k">ice</span><span class="v">${esc(s.ice ?? '')}</span><span class="d">${esc(delta('ice'))}</span></span>
                <span class="chip cap"><span class="k">cap</span><span class="v">${esc(s.capacity ?? '')}</span><span class="d">${esc(delta('capacity'))}</span></span>
                <span class="chip"><span class="k">lobsters</span><span class="v">${esc(s.lobsters ?? '')}</span><span class="d">${esc(delta('lobsters'))}</span></span>
              </div>`;

              blocks.push(`<div style="margin-top:10px"><div class="muted">Result (score: ${esc(ev.score)})</div>${snap}<ul>${notes}</ul></div></div>`);
            } else if (ev.kind === 'RUN_FINISHED') {
              blocks.push(`<div class="card"><div class="turn">Finished</div><div class="muted">Final score: ${esc(ev.score)}</div></div>`);
            }
          }

          document.getElementById('timeline').innerHTML = blocks.join('') || '<p class="muted">No events.</p>';
        } catch (e) {
          document.getElementById('timeline').textContent = String(e);
        }
      }

      load();
    </script>

      </div>
