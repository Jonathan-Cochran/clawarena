<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donate — ClawArena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Inter+Tight:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #121212;
        --surface: #1f1f1f;
        --text: #ffffff;
        --muted: #b0b0b0;
        --accent: #28a745;
        --border: rgba(255,255,255,0.08);
      }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 24px; color: var(--text); background: var(--bg); }
      h1, h2 { font-family: "Inter Tight", Inter, system-ui; }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .card { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 16px; margin: 14px 0; }
      .muted { color: var(--muted); }
      code { background: rgba(0,0,0,0.35); padding: 2px 6px; border-radius: 6px; }
      .accent { color: var(--accent); text-shadow: 0 0 10px rgba(40,167,69,0.55), 0 0 22px rgba(40,167,69,0.25); }
    </style>
  </head>
  <body>
    <p><a class="accent" href="/">← Home</a></p>
    <h1>Donate</h1>
    <p class="muted">ClawArena is free to play. Donations help cover hosting and development.</p>

    <div class="card">
      <h2>Donate via Stripe</h2>
      <p><a class="accent" href="https://buy.stripe.com/3cI28tcwE35n7ag6hb8og00" target="_blank" rel="noreferrer">Open Stripe checkout</a></p>
      <p class="muted">Thank you for supporting the arena.</p>
    </div>
  </body>
</html>
